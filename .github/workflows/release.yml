name: Package and release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag and TOC version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must match vX.Y.Z: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          tag_version=${GITHUB_REF_NAME#v}
          toc_version=$(sed -n 's/^## Version:[[:space:]]*//p' AnniversaryRaidTools.toc | tr -d '\r')
          if [[ "$toc_version" != "$tag_version" ]]; then
            echo "TOC version $toc_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 luajit subversion

      - name: Validate source
        run: ./scripts/validate-addon.sh

      - name: Stage cleaned release bundle
        uses: BigWigsMods/packager@v2
        with:
          args: -d -w 0 -l

      - name: Audit cleaned release bundle
        run: |
          ./scripts/validate-release.sh .release/AnniversaryRaidTools
          unzip -Z1 .release/AnniversaryRaidTools-*.zip | grep -Fx 'AnniversaryRaidTools_UI/AnniversaryRaidTools_UI.toc'

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -o -w 0 -l
